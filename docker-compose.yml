name: only-tasks

services:
  db:
    image: postgres:17
    container_name: only-tasks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Só localhost. 5432/5433/5434 já estão ocupadas por outros projetos.
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - only_tasks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  only_tasks_pgdata:
