# Produção (VPS). Uso:
#   cp .env.production.example .env.production   # e preencher os valores
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Detalhes e passo a passo: docs/04-deploy.md
name: only-tasks-prod

services:
  # Banco: NÃO publica porta nenhuma; só os outros serviços o enxergam.
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interno]

  # Aplica as migrações e sai. Também serve para criar usuário:
  #   docker compose --env-file .env.production -f docker-compose.prod.yml run --rm -it migrate node scripts/create-user.ts
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [interno]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Sem "ports": o app só é alcançado pelo Caddy (rede interna)
    networks: [interno]

  # Recebe a internet, cuida do HTTPS (certificado automático) e repassa ao app.
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [interno, publica]

  # Copia do banco todo dia para ./backups (mantém os últimos BACKUP_RETENTION_DAYS dias).
  backup:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
      # Espera as tabelas existirem: senão o primeiro backup sairia de um banco vazio
      migrate:
        condition: service_completed_successfully
    networks: [interno]

networks:
  # "internal: true" = sem acesso à internet: o banco e o app não saem para fora
  interno:
    internal: true
  publica: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
